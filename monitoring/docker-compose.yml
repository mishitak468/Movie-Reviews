services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # mount our config read-only so prometheus reads it but can't rewrite it
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    # auto-wire the prometheus data source on first boot so nobody has to add it by hand
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    # skip the forced password change on first login — fine for a coursework demo, not prod
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    restart: unless-stopped

# named volumes so metric history and dashboards survive container restarts
volumes:
  prometheus-data:
  grafana-data:
